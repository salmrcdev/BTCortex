name: Bug report
description: Report a reproducible problem with BTCortex.
title: 'bug: '
body:
  - type: markdown
    attributes:
      value: |
        Check existing issues and the known limitations before reporting a bug.
        Report vulnerabilities privately through the Security tab. Do not include credentials, wallet material or unredacted logs.
  - type: input
    id: version
    attributes:
      label: BTCortex version or commit
      placeholder: '0.1.0 / commit SHA'
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Windows version, connected service versions and relevant network (mainnet, testnet or regtest).
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide the smallest sequence that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behaviour
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitised logs or screenshots
      description: Remove personal information and secrets before attaching diagnostics.
